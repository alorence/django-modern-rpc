name: Tests & Checks

on:
  push:
    branches-ignore:
      - '*-no-ci'
    tags:
      - '*'
  pull_request:
    branches:
      - main
  schedule:
    # * is a special character in YAML and must be quoted
    - cron: '55 2 */7 * *'

env:
  UV_VERSION: 0.13.7

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
    - name: Print env information
      run: |
        echo "github.event_name = ${{ github.event_name }}"
        echo "github.ref = ${{ github.ref }}"
        echo "is a tag = ${{ startsWith(github.ref, 'refs/tags/') }}"
        echo "is a manual run = ${{ github.event.inputs.target_repo != '' }}"

  lockfile-check:
    runs-on: ubuntu-latest
    needs: debug
    steps:
    - uses: actions/checkout@v7
    - name: Install uv
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3, see https://github.com/astral-sh/setup-uv/releases
      with:
        version: ${{ env.UV_VERSION }}
    - name: Check lockfile
      run: uv lock --check

  linter:
    runs-on: ubuntu-latest
    needs: debug
    steps:
    - uses: actions/checkout@v7
    - name: Install uv
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3, see https://github.com/astral-sh/setup-uv/releases
      with:
        version: ${{ env.UV_VERSION }}
    - name: Ruff
      run: uv run ruff check .

  formatter:
    runs-on: ubuntu-latest
    continue-on-error: true
    needs: debug
    steps:
    - uses: actions/checkout@v7
    - name: Install uv
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3, see https://github.com/astral-sh/setup-uv/releases
      with:
        version: ${{ env.UV_VERSION }}
    - name: Ruff Format
      run: uv run ruff format . --check

  mypy:
    runs-on: ubuntu-latest
    needs: debug
    steps:
    - uses: actions/checkout@v7
    - name: Install uv
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3, see https://github.com/astral-sh/setup-uv/releases
      with:
        version: ${{ env.UV_VERSION }}
    - name: Mypy
      run: |
        uv run --group=type-checking mypy .

  ty:
    runs-on: ubuntu-latest
    needs: debug
    steps:
    - uses: actions/checkout@v7
    - name: Install uv
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3, see https://github.com/astral-sh/setup-uv/releases
      with:
        version: ${{ env.UV_VERSION }}
    - name: Ty
      continue-on-error: true
      run: |
        uv run --group=type-checking ty check .

  generate-jobs:
    runs-on: ubuntu-latest
    needs: debug
    outputs:
      session: ${{ steps.set-matrix.outputs.session }}
    steps:
    - uses: actions/checkout@v7
    - name: Install nox
      uses: wntrblm/nox@afa3983bbac3143bab5c8406244327581f76a3d7  # 2026.10.20 - https://github.com/wntrblm/nox/releases
    - name: Build GH Actions test matrix from nox sessions
      id: set-matrix
      shell: bash
      run: echo session=$(nox -t cicd-tests --list --json | jq -c '[.[].session]') | tee --append $GITHUB_OUTPUT

  tests:
    name: ${{ matrix.session }}
    needs: generate-jobs
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        session: ${{ fromJson(needs.generate-jobs.outputs.session) }}
    steps:
    - uses: actions/checkout@v7

    - name: Install nox
      uses: wntrblm/nox@afa3983bbac3143bab5c8406244327581f76a3d7  # 2026.10.20 - https://github.com/wntrblm/nox/releases

    - name: Install uv
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3, see https://github.com/astral-sh/setup-uv/releases
      with:
        version: ${{ env.UV_VERSION }}

    - name: Test session
      run: nox -s "${{ matrix.session }}" -- --cov --cov-report=xml:coverage.xml

    - name: Submit coverage report - Coveralls
      continue-on-error: true
      uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2.3.8 - https://github.com/coverallsapp/github-action/releases

    - name: Submit coverage report - Codacy
      continue-on-error: true
      uses: codacy/codacy-coverage-reporter-action@v1.3.0
      with:
        project-token: ${{ secrets.CODACY_PROJECT_TOKEN }}
        coverage-reports: coverage.xml

    - uses: gacts/github-slug@c29c0ddd888a1703a6fc06c55a5f6ddd7beae490 # v1.3.6 - https://github.com/gacts/github-slug/releases
      id: test-session-slug
      with:
        to-slug: "${{ matrix.session }}"

    - name: Archive coverage report
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 - https://github.com/actions/upload-artifact/releases
      with:
        name: report-${{ steps.test-session-slug.outputs.slug }}
        path: coverage.xml

  sonar:
    runs-on: ubuntu-latest
    needs: tests
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0  # SonraQube analysis requires disabling shallow clones

    - name: Collect coverage report files
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2 - https://github.com/actions/download-artifact/releases
      with:
        path: ./artifacts

    - name: SonarQube Scan + Coverage upload
      continue-on-error: true
      uses: SonarSource/sonarqube-scan-action@e805d875275f728fac1885b413934be6d7c63f65 # v8.4.1 - https://github.com/SonarSource/sonarqube-scan-action/releases
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      with:
        args: >
          --define sonar.python.coverage.reportPaths="artifacts/report-*/coverage.xml"
